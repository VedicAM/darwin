[package]
name = "darwin"
version = "0.1.0"
description = "darwin desktop app"
authors = ["VedicAM"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "darwin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"

# The `research.arxiv` capability is the one place the harness talks to the
# network. reqwest is the same client Tauri already links, and the blocking
# flavour keeps the capability synchronous like every other harness entry
# point, so no async runtime is introduced here. `default-features = false`
# drops the pieces nothing uses; rustls avoids a system OpenSSL dependency.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "charset",
    "http2",
    "rustls",
] }
quick-xml = "0.42"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
